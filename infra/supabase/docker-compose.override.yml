# Repo-owned Supabase overrides that stay stable across upstream refreshes.
#
# The fetched upstream stack and the app stack both attach to the same named
# Docker network so backend services can resolve db/kong/storage/ollama locally.
services:
  storage:
    volumes:
      - ragdoll_supabase_storage:/var/lib/storage

  imgproxy:
    volumes:
      - ragdoll_supabase_storage:/var/lib/storage

networks:
  default:
    name: ${RAGDOLL_DOCKER_NETWORK:-ragdoll-dev}

volumes:
  ragdoll_supabase_storage:
