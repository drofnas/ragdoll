services:
  backend:
    environment:
      ALLOWED_ORIGINS: http://frontend:3000,http://localhost:8030
      E2E_SHARED_BACKENDS: "true"

  document-vector:
    environment:
      E2E_SHARED_BACKENDS: "true"

  frontend:
    environment:
      VITE_API_URL: http://backend:8000

  e2e:
    build:
      context: ../../
      dockerfile: tests/e2e/Dockerfile.dev
    working_dir: /app/tests/e2e
    env_file:
      - ../../apps/api/.env
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_BASE_URL: http://backend:8000
    depends_on:
      frontend:
        condition: service_started
