services:
  backend:
    environment:
      ALLOWED_ORIGINS: http://frontend:3000,http://localhost:8030
      E2E_SHARED_BACKENDS: "true"

  worker:
    environment:
      E2E_SHARED_BACKENDS: "true"

  frontend:
    environment:
      VITE_API_URL: http://backend:8000

  e2e:
    build:
      context: ../../tests/e2e
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      E2E_BASE_URL: http://frontend:3000
    depends_on:
      frontend:
        condition: service_started
